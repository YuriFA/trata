services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    image: trata-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://expense:expense@db:5432/expense?sslmode=disable
      CONFIG_PATH: /app/prod.yaml
      # Dev-only: the session cookie is served over plain HTTP through the Vite
      # proxy. WebKit/Safari reject `Secure` cookies on http://localhost, so
      # disable Secure here for local dev (prod.yaml keeps `secure: true`).
      SESSION_SECURE: "false"
    ports:
      - "8080:8080"

volumes:
  pgdata:
