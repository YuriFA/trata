schema: spec-driven

githubCopilot:
  cloudAgent: true

# Project context (injected into all artifact instructions).
# Keep compact: only stable, global facts needed for almost any OpenSpec task.
# Per-area working rules live in AGENTS.md files; domain behavior lives in
# openspec/specs/; open decisions in docs/assumptions.md.
context: |
  PRODUCT:
  Trata — personal finance app. Users manage accounts
  (USD/EUR/RUB), per-user categories, and income/expense/transfer
  transactions; the backend serves per-account balances with the
  account listing. Apps are ruble-only over the multi-currency-ready
  contract.
  Domain entities: User, Account, Category, Transaction.
  One backend serves two clients of the same product: a Vue 3 web app
  and a React Native (Expo) mobile app.

  REPOSITORY:
  backend/       Go API (Gin + sqlc + Postgres)
  apps/web/      Vue 3 + Vite (Feature-Sliced Design)
  apps/mobile/   React Native + Expo (FSD + Expo Router)
  packages/      shared platform-agnostic TS: api, dates, local-data, money, i18n; css: tokens

  STATUS (brief): backend and web are complete and tested; the web app
  uses the existing API (online-first). Mobile is in active development,
  offline-first: local SQLite + sync engine are integrated with the
  backend (session auth + sync push/pull); i18n wiring pending.

  ARCHITECTURE:
  - docs/api/openapi.yaml is the source of truth for the HTTP API
    contract ONLY — not for product/domain behavior as a whole. Backend
    server code and TS API types are generated from it; never hand-edit
    generated files. Regeneration commands live in the AGENTS.md files.
  - openspec/specs/ describe current product/domain behavior;
    openspec/changes/ hold proposed changes.
  - Shared packages stay platform-agnostic (fetch-family APIs only; no
    DOM/Vue/RN imports in packages/*).

  GLOBAL INVARIANTS:
  - Money is int64 minor units (divisor 100) at persistence/transport/
    sync/calculation boundaries; form/UI state may use a platform-
    appropriate representation converted exactly once at the mapper seam
    (no integer-precision loss).
  - Timestamps are UTC; IDs are UUID v4.
  - Auth is a stateful session cookie (session_id); no JWT.
  - API errors carry a machine-readable code + human-readable message;
    clients switch on the code, not the HTTP status.
  - All user data is scoped to its owner; cross-user access is rejected.

  PRODUCT/AI RULE:
  - Do NOT treat TODOs, code comments, stale docs, roadmap items, or UI
    placeholders as implemented behavior.
  - If product behavior is not defined, do not invent it: record it as
    an explicit product decision in an OpenSpec change.
  - Do not mistake a technical implementation for a product requirement.

  Deeper info: AGENTS.md files (root + backend/, apps/web/, apps/mobile/)
  for HOW to work in the repo; openspec/specs/ for domain behavior;
  docs/architecture/overview.md for the architecture map;
  docs/assumptions.md for open decisions; docs/technical-debt.md for
  known problems.
