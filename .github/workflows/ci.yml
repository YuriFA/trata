name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the base ref is available for oasdiff
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Lint OpenAPI spec (Redocly)
        run: npx --yes @redocly/cli@latest lint --config docs/api/redocly.yaml docs/api/openapi.yaml
      - name: Detect breaking contract changes (oasdiff)
        # Only meaningful on PRs: compare the spec against the PR base branch.
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin "${{ github.base_ref }}"
          if git cat-file -e "origin/${{ github.base_ref }}:docs/api/openapi.yaml" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:docs/api/openapi.yaml" > /tmp/base.yaml
            cp docs/api/openapi.yaml /tmp/head.yaml
            docker run --rm -v /tmp:/spec tufin/oasdiff:v1.30.0 breaking /spec/base.yaml /spec/head.yaml
          else
            echo "No baseline spec on base ref; skipping breaking-change check."
          fi

  migrations:
    # Rollback-safety guard: rollback redeploys old images against the
    # current schema, so up-migrations must stay additive (expand-contract;
    # docs/deployment.md, Rollback). Runs on both deploy paths too, but
    # catching it in a PR is cheaper than at deploy time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-migrations.sh

  gen-check:
    # Go codegen drift + the sync-catalog generator drift (the generator
    # needs gofmt for its Go output, hence the Node steps on this Go job).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      # Versions are pinned via go.mod (see backend/tools.go), so plain
      # `go install <path>` resolves to the exact committed version.
      - name: Install codegen tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen
          go install github.com/sqlc-dev/sqlc/cmd/sqlc
      - name: Verify generated code is in sync
        run: make gen-check
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        # oxfmt (hoisted to root node_modules/.bin by node-linker=hoisted)
        # normalizes the TS artifacts; without install the generator fails.
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Verify sync catalog is in sync
        working-directory: .
        run: pnpm sync-catalog:gen-check

  ts-gen-check:
    # TS counterpart of gen-check: regenerating the contract types must
    # leave the tree clean — if schema.ts drifts from openapi.yaml, fail.
    # Also gates the sync catalog <-> OpenAPI contract parity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate TS contract types
        run: pnpm --filter @expense-tracker/api gen:api
      - name: Verify generated schema is in sync
        run: git diff --exit-code packages/api/src/schema.ts
      - name: Check sync catalog / OpenAPI parity
        run: pnpm sync-catalog:parity

  arch-check:
    # Architecture rules via dependency-cruiser (configs at repo root):
    # packages leaf/direction + platform bans, mobile FSD layer direction +
    # cross-slice + api-client seam, date-fns facade ban. Backend layering
    # is enforced separately by depguard inside the lint-test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run architecture checks
        run: pnpm arch:check
      - name: Run web FSD lint
        run: pnpm --filter web lint:fsd

  design-lint:
    # Mechanical design-system rules: token usage, shared spec drift,
    # shell headers, and flat-system guardrails in web/mobile UI code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run design lint
        run: pnpm lint:design

  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
      - run: go test -race ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: expense-tracker-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backup image (smoke)
        uses: docker/build-push-action@v6
        with:
          # Catches rot in the backup sidecar (deploy/backup) on every PR.
          context: deploy/backup
          push: false
          tags: expense-tracker-backup:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
