  /api/sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Push пакета клиентских операций
      description: |
        Применяет пакет операций offline-first клиента. Каждая операция
        обрабатывается независимо (частичный успех не откатывает применённые
        элементы) и получает свой результат:

        - `applied` — операция применена, `version` = новая серверная версия
          записи;
        - `conflict` — CAS-конфликт (`SYNC_VERSION_CONFLICT` при несовпадении
          `baseVersion`, `SYNC_ALREADY_EXISTS` когда запись с таким id уже
          существует и пришёл другой `opId`, `SYNC_DELETED_CONFLICT` когда
          запись на сервере удалена), `serverState` = текущее состояние записи;
        - `error` — нарушение бизнес-правил (например `CATEGORY_IN_USE`,
          `INVALID_REFS`, `CATEGORY_ALREADY_EXISTS`).

        Идемпотентность постоянна: повторная доставка уже применённого `opId`
        (в том числе в другом батче/сессии) возвращает сохранённый результат
        без побочных эффектов. Update применяется только если текущая версия
        записи на сервере равна `baseVersion`. Create (`baseVersion = 0`):
        записи нет → создать; есть + тот же `opId` → replay сохранённого
        результата; есть + другой `opId` → `SYNC_ALREADY_EXISTS` без
        перезаписи. Delete уже удалённой записи идемпотентен (`applied`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Per-item результаты в порядке операций запроса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Инкрементальный pull изменений по курсору
      description: |
        Возвращает изменения user из change-log с `seq` строго больше
        `cursor`, в порядке `seq` (upsert + tombstone, с серверной `version`
        каждой записи), плюс `nextCursor` — курсор следующей страницы или
        `null`, когда клиент догнал сервер. Пагинация через `limit`; клиент
        продолжает с сохранённого курсора ровно с того места, где остановился.
      parameters:
        - name: cursor
          in: query
          description: Последний полученный seq (0 = с начала истории).
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Page size (default 100, max 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Страница изменений + nextCursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/push/subscriptions:
    post:
      tags: [Push]
      operationId: upsertPushSubscription
      summary: Зарегистрировать (обновить) push-подписку устройства
      description: |
        Upsert по `endpoint`: повторная регистрация того же endpoint
        обновляет ключи и таймзону устройства, не создавая дубликатов.
        Подписки — записи per-device: не участвуют в синхронизации
        (нет change-log), не видны другим участникам household.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionUpsertRequest"
      responses:
        "200":
          description: Сохранённая подписка (создана или обновлена).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Неизвестное имя таймзоны (IANA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                timezoneInvalid:
                  value:
                    code: PUSH_SUBSCRIPTION_TIMEZONE_INVALID
                    message: unknown timezone
        "500":
          $ref: "#/components/responses/InternalError"

  /api/push/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/PushSubscriptionId"
    delete:
      tags: [Push]
      operationId: deletePushSubscription
      summary: Удалить push-подписку устройства
      description: |
        Удаляет подписку текущего user по её id. Чужая или несуществующая
        подписка ведёт себя как not-found (данные не раскрываются).
      responses:
        "204":
          description: Подписка удалена.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PushSubscriptionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/config/push:
    get:
      tags: [Push]
      operationId: getPushConfig
      summary: Конфигурация Web Push
      description: |
        Публичный VAPID-ключ и признак включённости push на сервере.
        Клиент скрывает opt-in напоминаний, когда push не настроен
        (`enabled=false`).
      responses:
        "200":
          description: Конфигурация push.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness-проба процесса
      description: |
        Unauthenticated liveness probe for deployment healthchecks: succeeds
        while the process is serving requests. Deliberately touches no
        session, no database, and no business logic — the database has its
        own container healthcheck; a readiness variant was rejected so DB
        blips tolerated by local-first clients do not bounce the API.
        The payload also carries the API build version (the deployed image
        tag, `sha-<short>`, or `dev` for unversioned builds), so the running
        build can be identified without server access.
      security: []
      responses:
        "200":
          description: Процесс обслуживает запросы.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: |
        Stateful session cookie. Auth is session-based (NOT JWT): the server keeps
        session rows in the database and validates the cookie on every request.

        ## Session lifecycle

        - **Creation (`register`, `login`)** - always mints a fresh `session_id`
          and sets it in the cookie. Issuing a new ID on every login is a session
          fixation defense: the server never reuses an ID an attacker may have set
          before login. Existing sessions for that user are NOT invalidated -
          multi-session is supported (web + mobile in parallel).
        - **Logout** - invalidates ONLY the current session (deleted from the DB,
          cookie cleared). Other sessions for the user stay valid. Idempotent.
        - **Sliding expiration** - on every authenticated request, if less than
          25% of the TTL remains, the session is extended to `now + TTL` and the
          cookie refreshed. Without activity the session expires at `expires_at`.
        - **Password reset** - a successful reset revokes ALL of the user's
          sessions; the user re-logs in with the new password.
        - **User deletion** - `ON DELETE CASCADE` kills all of a user's sessions
          at the schema level.

  parameters:
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Уникальный client-generated ключ (UUID recommended). Один ключ =
        один intent. Повтор того же запроса возвращает тот же ответ.
      schema:
        type: string
        maxLength: 255
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DebtorId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DebtOperationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlannedPaymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PushSubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Не авторизован (нет валидной session cookie).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: UNAUTHORIZED
            message: missing session cookie
    InternalError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_ERROR
            message: internal server error
    ValidationError:
      description: Неверное тело запроса (validation failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_FAILED
            message: validation failed
    Forbidden:
      description: |
        Действие не разрешено роли вызывающего (например, owner-only
        операции household вызывает member) или чужой ресурс.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: FORBIDDEN
            message: forbidden
    TransactionNotFound:
      description: Транзакция не найдена (или чужая).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: TRANSACTION_NOT_FOUND
            message: transaction not found
    TransactionVersionConflict:
      description: Конфликт в версии транзакции (optimistic concurrency).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: TRANSACTION_VERSION_CONFLICT
            message: transaction version conflict
    AccountNotFound:
      description: Счёт не найден (или чужой).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_NOT_FOUND
            message: account not found
    CategoryNotFound:
      description: Категория не найдена (или чужая).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CATEGORY_NOT_FOUND
            message: category not found
    AccountInUse:
      description: Счёт имеет привязанные transactions, удаление невозможно.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_IN_USE
            message: account has transactions and cannot be deleted
    CategoryInUse:
      description: |
        Категория занята: есть привязанные transactions (удаление без
        `cascade`) или live плановые платежи (удаление/архивация).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            transactions:
              value:
                code: CATEGORY_IN_USE
                message: category has transactions and cannot be deleted
            plannedPayments:
              value:
                code: CATEGORY_IN_USE
                message: category has planned payments and cannot be deleted
    CategoryAlreadyExists:
      description: Категория с таким name уже есть у user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CATEGORY_ALREADY_EXISTS
            message: category already exists
    AccountAlreadyExists:
      description: Счет с таким id уже есть у user (клиентский id-дубликат).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_ALREADY_EXISTS
            message: account already exists
    AccountVersionConflict:
      description: Конфликт в версии счета (optimistic concurrency).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_VERSION_CONFLICT
            message: account version conflict
    DebtorNotFound:
      description: Должник не найден (или чужой).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DEBTOR_NOT_FOUND
            message: debtor not found
    DebtorAlreadyExists:
      description: Должник с таким name (или id) уже есть у user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DEBTOR_ALREADY_EXISTS
            message: debtor already exists
    DebtorInUse:
      description: У должника есть не удалённые debt operations, удаление невозможно.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DEBTOR_IN_USE
            message: debtor has debt operations and cannot be deleted
    DebtOperationNotFound:
      description: Долговая операция не найдена (или чужая).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DEBT_OPERATION_NOT_FOUND
            message: debt operation not found
    DebtOperationAlreadyExists:
      description: Операция с таким id уже есть у user (клиентский id-дубликат).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DEBT_OPERATION_ALREADY_EXISTS
            message: debt operation already exists
    DebtOperationVersionConflict:
      description: Конфликт в версии операции (optimistic concurrency).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DEBT_OPERATION_VERSION_CONFLICT
            message: debt operation version conflict
    PlannedPaymentNotFound:
      description: Плановый платёж не найден (или чужой).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PLANNED_PAYMENT_NOT_FOUND
            message: planned payment not found
    PushSubscriptionNotFound:
      description: Push-подписка не найдена (или чужая).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PUSH_SUBSCRIPTION_NOT_FOUND
            message: push subscription not found
    PlannedPaymentAlreadyExists:
      description: Плановый платёж с таким id уже есть у user (клиентский id-дубликат).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PLANNED_PAYMENT_ALREADY_EXISTS
            message: planned payment already exists
    PlannedPaymentVersionConflict:
      description: Конфликт в версии планового платежа (optimistic concurrency).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PLANNED_PAYMENT_VERSION_CONFLICT
            message: planned payment version conflict

  schemas:
    Health:
      type: object
      description: Liveness-статус процесса API.
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
          description: Всегда `ok`, пока процесс обслуживает запросы.
        version:
          type: string
          description: |
            Версия сборки API: тег развернутого образа (`sha-<short>`,
            передается через build-arg `VERSION`) или `dev` для сборок без
            версии (`go run`, тесты).

    PushSubscriptionKeys:
      type: object
      description: Ключи шифрования доставки Web Push (RFC 8291), base64.
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          minLength: 1
          maxLength: 512
        auth:
          type: string
          minLength: 1
          maxLength: 512

    PushSubscriptionUpsertRequest:
      type: object
      description: |
        Регистрация устройства для напоминаний плановых платежей.
        `endpoint` — URL push-сервиса (bearer-секрет: не логируется и не
        отдаётся другим клиентам), `keys` — ключи доставки, `timeZone` —
        IANA-имя таймзоны устройства: напоминания отправляются в 10:00
        локального времени подписки. Повторный вызов с тем же `endpoint`
        обновляет ключи и таймзону (upsert, не дубль).
      required: [endpoint, keys, timeZone]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
        keys:
          $ref: "#/components/schemas/PushSubscriptionKeys"
        timeZone:
          type: string
          maxLength: 64
          description: IANA time zone name, например `Europe/Moscow`.

    PushSubscription:
      type: object
      description: Сохранённая push-подписка устройства.
      required: [id, endpoint, keys, timeZone, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор подписки (для DELETE).
        endpoint:
          type: string
          format: uri
        keys:
          $ref: "#/components/schemas/PushSubscriptionKeys"
        timeZone:
          type: string
        createdAt:
          type: string
          format: date-time

    PushConfig:
      type: object
      description: Публичная конфигурация Web Push-канала.
      required: [enabled, vapidPublicKey]
      properties:
        enabled:
          type: boolean
          description: |
            false — push не настроен на сервере (нет VAPID-ключей);
            клиент скрывает opt-in напоминаний.
        vapidPublicKey:
          type: string
          description: Публичный VAPID-ключ (base64); пустая строка при enabled=false.

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
          maxLength: 100
          description: |
            Опциональное отображаемое имя; null — не задано (потребители
            используют email).
        emailVerified:
          type: boolean
          description: Подтверждён ли email.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, emailVerified, createdAt, updatedAt]

    UpdateUserRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Новое отображаемое имя. Непустое после trim; в v1 способ задать
            имя есть, способ сбросить (вернуть null) — нет.

    Household:
      type: object
      description: |
        Общее пространство данных семьи: все записи (счета, категории,
        транзакции, ...) принадлежат household, участники имеют равный доступ.
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        name:
          type: string
          nullable: true
          maxLength: 100
          description: |
            Отображаемое имя household (editor: owner). null — не задано;
            потребители выводят производную подпись от аккаунта owner.
        currency:
          $ref: "#/components/schemas/Currency"
        members:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdMember"
      required: [id, createdAt, members, currency]

    HouseholdMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
          description: Отображаемое имя; null — не задано.
        role:
          type: string
          enum: [owner, member]
        joinedAt:
          type: string
          format: date-time
      required: [userId, email, role, joinedAt]

    UpdateHouseholdRequest:
      type: object
      description: |
        `name = null` сбрасывает имя; непустая строка — задаёт (1-100
        символов). `currency` — новая базовая валюта (owner only),
        отсутствует = не менять; смена не переписывает хранимые суммы.
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        currency:
          $ref: "#/components/schemas/Currency"
      required: [name]

    CreateHouseholdInvitationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email приглашаемого (принять сможет только этот аккаунт).

    HouseholdInvitation:
      type: object
      description: |
        Приглашение household для owner-листинга. Статус вычисляется на
        чтении; повторная отправка тому же email обновляет токен/срок.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, email, status, createdAt, expiresAt]

    HouseholdInvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdInvitation"

    HouseholdInvitationPreview:
      type: object
      description: |
        Превью приглашения для экрана принятия (имя household, состав,
        приглашающий). Доступно только аккаунту с совпадающим email.
      properties:
        householdName:
          type: string
          nullable: true
          description: Имя household; null — не задано (вывести производную подпись).
        membersCount:
          type: integer
          minimum: 1
        inviterEmail:
          type: string
          format: email
        inviterDisplayName:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
      required: [householdName, membersCount, inviterEmail, expiresAt]

    HouseholdCode:
      type: object
      description: |
        Активный код входа household. Многоразовый, без привязки к личности;
        ротация заменяет прежний код, отзыв деактивирует.
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          description: 8 символов алфавита без неоднозначных (без 0/O/1/I).
        createdAt:
          type: string
          format: date-time
      required: [code, createdAt]

    JoinHouseholdRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          description: Активный код household.

    DissolveHouseholdRequest:
      type: object
      description: Явное подтверждение деструктивного расформирования.
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Должно быть true — иначе 400.

    Transaction:
      type: object
      description: |
        Cashflow-транзакция (income/expense) содержит `categoryId` и
        опционально `accountId` (null = «без счета»: не влияет ни на один
        баланс). Transfer содержит `fromAccountId`+`toAccountId`. Adjustment
        (сверка баланса) содержит только `accountId`. Формы ссылок
        взаимоисключающие.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [income, expense, transfer, adjustment]
        amount:
          type: integer
          format: int64
          description: |
            Минорные единицы (divisor 100 — у всех валют каталога).
            Положительный для income/expense/transfer; для adjustment —
            ненулевое знаковое значение (отрицательное уменьшает баланс,
            положительное увеличивает).
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        fromAccountId:
          type: string
          format: uuid
          nullable: true
        toAccountId:
          type: string
          format: uuid
          nullable: true
        destinationAmount:
          type: integer
          format: int64
          description: |
            Только для transfer при разных валютах счетов: сумма зачисления
            в валюте `toAccountId` (positive). Отсутствует, когда валюты
            совпадают (тогда `amount` списывается и зачисляется как есть).
            Эффективный курс восстановим как destinationAmount / amount.
        version:
          type: integer
          format: int
          description: Версия транзакции
      required:
        [
          id,
          userId,
          type,
          amount,
          description,
          occurredAt,
          createdAt,
          updatedAt,
          version,
        ]

    TransactionCreateRequest:
      type: object
      required: [type, amount, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4): offline-first клиенты
            генерируют его локально, сервер использует его как id записи.
            Дубликат для user → 409 `TRANSACTION_ALREADY_EXISTS`.
        type:
          type: string
          enum: [income, expense, transfer, adjustment]
        amount:
          type: integer
          format: int64
          description: |
            Положительный (> 0) для income/expense/transfer; для adjustment —
            ненулевое знаковое значение (сверка баланса: отрицательное
            уменьшает баланс счёта, положительное увеличивает).
        description:
          type: string
          default: ""
        occurredAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional для income/expense (отсутствие/null = «без счета»,
            транзакция не влияет ни на один баланс). Required для
            adjustment. Forbidden для transfer.
        categoryId:
          type: string
          format: uuid
          description: Required для income/expense. Forbidden для transfer/adjustment.
        fromAccountId:
          type: string
          format: uuid
          description: Required для transfer. Forbidden для income/expense/adjustment.
        toAccountId:
          type: string
          format: uuid
          description: Required для transfer. Forbidden для income/expense/adjustment.
        destinationAmount:
          type: integer
          format: int64
          description: |
            Transfer при разных валютах `fromAccountId`/`toAccountId`:
            required, positive, в валюте `toAccountId`. При одинаковых
            валютах forbidden.

    TransactionUpdateRequest:
      type: object
      description: Все поля кроме `version` optional. Поле `type` менять нельзя.
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        amount:
          type: integer
          format: int64
          description: |
            Для adjustment-транзакций — ненулевое знаковое значение; для
            остальных типов — положительное.
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
          description: |
            Устанавливает счёт для income/expense/adjustment. Очистить счёт
            через PATCH нельзя (null/отсутствие = без изменений): local-first
            клиенты очищают через sync full-state replace.
        categoryId:
          type: string
          format: uuid
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        destinationAmount:
          type: integer
          format: int64
          description: |
            Для cross-currency transfer — сумма зачисления (positive,
            в валюте `toAccountId`); правило валидируется против
            эффективных ссылок после обновления. Для same-currency —
            forbidden.
      required: [version]

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable сообщение.
      required: [code, message]

    SessionResponse:
      type: object
      description: Метаданные сессии без токена.
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Грубый proxy последней активности (обновляется при sliding).
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
      required: [createdAt, updatedAt, expiresAt, isCurrent]

    Currency:
      type: string
      description: |
        Каталог поддерживаемых валют: 18 ISO-кодов, все двухзнаковые
        (divisor 100). Каталог фиксированный и расширяется только
        координированным изменением (DB CHECK + контракт + пакеты).
      enum: [USD, EUR, RUB, GBP, CNY, TRY, PLN, GEL, KZT, UAH, AMD, AZN, UZS, KGS, RSD, ILS, AED, THB]

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        openingBalance:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
          description: |
            Вычисляется сервером (opening + Σ транзакций: income +, expense −,
            transfer −amount/+destinationAmount (при одинаковых валютах
            −amount/+amount), adjustment — знаковое значение).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int
          description: Версия счёта (optimistic concurrency).
      required: [id, userId, name, currency, openingBalance, balance, createdAt, updatedAt, version]

    AccountCreateRequest:
      type: object
      required: [name, currency, openingBalance]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4). Дубликат для user →
            409 `ACCOUNT_ALREADY_EXISTS`.
        name:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        openingBalance:
          type: integer
          format: int64

    AccountUpdateRequest:
      type: object
      description: |
        Все поля кроме `version` optional. `version` — optimistic concurrency
        (аналогично транзакциям): при параллельном изменении → 409
        `ACCOUNT_VERSION_CONFLICT`.
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        name:
          type: string
          minLength: 3
      required: [version]

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
        color:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Момент архивации; null — активная категория. Архивная категория
            недоступна для новых transactions/планов, но остаётся на
            существующих записях.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int
          description: Версия категории (optimistic concurrency).
      required: [id, userId, name, type, icon, color, archivedAt, createdAt, updatedAt, version]

    CategoryCreateRequest:
      type: object
      required: [name, type, icon, color]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4). Дубликат для user →
            409 `CATEGORY_ALREADY_EXISTS`.
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
        color:
          type: string

    CategoryUpdateRequest:
      type: object
      description: |
        Все поля кроме `version` optional. `version` — optimistic concurrency:
        при параллельном изменении → 409 `CATEGORY_VERSION_CONFLICT`.
        `archived: true` архивирует категорию (сервер проставляет
        `archivedAt`), `archived: false` разархивирует; отсутствие поля —
        без изменения. Архивация запрещена (409 `CATEGORY_IN_USE`), пока
        на категорию ссылаются live плановые платежи.
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
        archived:
          type: boolean
      required: [version]

    Debtor:
      type: object
      description: |
        Человек, с которым user отслеживает долги. Балансы не хранятся:
        они производны от debt operations (по направлениям, без неттинга).
        `currency` — валюта леджера: суммы операций интерпретируются в ней,
        при создании без валюты берётся базовая валюта household,
        после создания неизменяема.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        note:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int
          description: Версия должника (optimistic concurrency).
      required: [id, userId, name, note, currency, createdAt, updatedAt, version]

    DebtorCreateRequest:
      type: object
      description: |
        `currency` опционален: отсутствие = базовая валюта household.
        После создания валюта должника неизменяема.
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4). Дубликат для user →
            409 `DEBTOR_ALREADY_EXISTS`.
        name:
          type: string
          minLength: 1
        note:
          type: string
          default: ""
        currency:
          $ref: "#/components/schemas/Currency"

    DebtorUpdateRequest:
      type: object
      description: |
        Все поля кроме `version` optional. `version` — optimistic concurrency:
        при параллельном изменении → 409 `DEBTOR_VERSION_CONFLICT`.
        `note`: отсутствует = не менять, `""` = очистить; `null` невалиден.
        `currency` изменению не подлежит (попытка — invalid payload).
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        name:
          type: string
          minLength: 1
        note:
          type: string
      required: [version]

    DebtOperation:
      type: object
      description: |
        Запись долгового леджера. `direction` = receivable («мне должны»)
        или payable («я должен»); kind = debt (долг растёт) или repayment
        (списание — долг уменьшается). Баланс должника в направлении =
        Σ(debt) − Σ(repayment) по live-операциям; направления независимы
        (без неттинга) и баланс может стать отрицательным при переплате.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        debtorId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [receivable, payable]
        kind:
          type: string
          enum: [debt, repayment]
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Положительные минорные единицы (divisor 100).
        note:
          type: string
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int
          description: Версия операции (optimistic concurrency).
      required:
        [
          id,
          userId,
          debtorId,
          direction,
          kind,
          amount,
          note,
          occurredAt,
          createdAt,
          updatedAt,
          version,
        ]

    DebtOperationCreateRequest:
      type: object
      required: [debtorId, direction, kind, amount, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4). Дубликат для user →
            409 `DEBT_OPERATION_ALREADY_EXISTS`.
        debtorId:
          type: string
          format: uuid
          description: Существующий live-должник того же user.
        direction:
          type: string
          enum: [receivable, payable]
        kind:
          type: string
          enum: [debt, repayment]
        amount:
          type: integer
          format: int64
          minimum: 1
        note:
          type: string
          default: ""
        occurredAt:
          type: string
          format: date-time

    DebtOperationUpdateRequest:
      type: object
      description: |
        Все поля кроме `version` optional. `debtorId`, `direction` и `kind`
        менять нельзя. `note`: отсутствует = не менять, `""` = очистить;
        `null` невалиден.
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        amount:
          type: integer
          format: int64
          minimum: 1
        note:
          type: string
        occurredAt:
          type: string
          format: date-time
      required: [version]

    PlannedPayment:
      type: object
      description: |
        Регулярный плановый платёж (расход: подписки, платежи по кредитам;
        доход: зарплата, премии). Подтверждение плана создаёт обычную
        транзакцию (type/account/category из плана) и сдвигает `nextDue` на
        период. `anchorDate` — дата-якорь серии: регулярность считается от её
        дня (день месяца / день недели / месяц+день), в коротких месяцах
        вхождения клампятся к последнему дню и возвращаются к якорю
        (31 → 28/29 → 31). Изменение `nextDue` пользователем сбрасывает якорь.
        Название не уникально (два «Netflix» легальны); у созданных планом
        транзакций `description` = название плана.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [expense, income]
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Положительные минорные единицы (divisor 100).
        name:
          type: string
          description: Опциональное название; пустая строка = без названия.
        accountId:
          type: string
          format: uuid
          description: Live-счёт того же user (счёт списания/зачисления).
        categoryId:
          type: string
          format: uuid
          description: Live-категория того же user, тип совпадает с типом плана.
        nextDue:
          type: string
          format: date
          description: Дата следующего вхождения; прошедшая дата допустима (план сразу просрочен).
        anchorDate:
          type: string
          format: date
          description: Дата-якорь серии (день месяца/недели/года для регулярности).
        regularity:
          type: string
          enum: [daily, weekly, monthly, yearly]
        confirmMode:
          type: string
          enum: [manual, auto]
          description: auto — серверная джоба создаёт транзакции без участия user.
        reminder:
          type: string
          enum: [off, day_before, on_day]
          description: Локальные напоминания на устройствах (off / за день / в день).
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int
          description: Версия планового платежа (optimistic concurrency).
      required:
        [
          id,
          userId,
          type,
          amount,
          name,
          accountId,
          categoryId,
          nextDue,
          anchorDate,
          regularity,
          confirmMode,
          reminder,
          note,
          createdAt,
          updatedAt,
          version,
        ]

    PlannedPaymentCreateRequest:
      type: object
      required: [type, amount, accountId, categoryId, nextDue, regularity, confirmMode]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4). Дубликат для user →
            409 `PLANNED_PAYMENT_ALREADY_EXISTS`.
        type:
          type: string
          enum: [expense, income]
        amount:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          default: ""
        accountId:
          type: string
          format: uuid
          description: Существующий live-счёт того же user.
        categoryId:
          type: string
          format: uuid
          description: Существующая live-категория того же user с совпадающим типом.
        nextDue:
          type: string
          format: date
        regularity:
          type: string
          enum: [daily, weekly, monthly, yearly]
        confirmMode:
          type: string
          enum: [manual, auto]
        reminder:
          type: string
          enum: [off, day_before, on_day]
          default: "off"
        note:
          type: string
          default: ""

    PlannedPaymentUpdateRequest:
      type: object
      description: |
        Все поля кроме `version` optional. `type` менять нельзя. Изменение
        `nextDue` сбрасывает `anchorDate` на новую дату. `name` / `note`:
        отсутствует = не менять, `""` = очистить; `null` невалиден.
        `version` — optimistic concurrency: при параллельном изменении →
        409 `PLANNED_PAYMENT_VERSION_CONFLICT`.
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        amount:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        nextDue:
          type: string
          format: date
        regularity:
          type: string
          enum: [daily, weekly, monthly, yearly]
        confirmMode:
          type: string
          enum: [manual, auto]
        reminder:
          type: string
          enum: [off, day_before, on_day]
        note:
          type: string
      required: [version]

    AccountSyncData:
      type: object
      additionalProperties: false
      description: Полное состояние счёта в sync-операции (upsert).
      required: [name, currency, openingBalance]
      properties:
        name:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        openingBalance:
          type: integer
          format: int64

    CategorySyncData:
      type: object
      additionalProperties: false
      description: |
        Полное состояние категории в sync-операции (upsert). `archivedAt`
        опционален для обратной совместимости (отсутствие = null = активная).
      required: [name, type, icon, color]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
        color:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: null — активная категория.

    CategoryDeleteData:
      type: object
      additionalProperties: false
      description: |
        Опции удаления категории в sync-операции (delete). Отсутствие
        `data` — обычное guarded-удаление; `{"cascade": true}` — сервер
        атомарно ставит tombstone на категорию и все привязанные не
        удалённые transactions домохозяйства.
      required: [cascade]
      properties:
        cascade:
          type: boolean

    TransactionSyncData:
      type: object
      additionalProperties: false
      description: |
        Полное состояние транзакции в sync-операции (upsert). Cashflow
        (income/expense) несёт `categoryId` и опционально `accountId`
        (null = «без счета»), transfer — `fromAccountId`+`toAccountId`,
        adjustment — только `accountId`.
      required: [type, amount, description, occurredAt]
      properties:
        type:
          type: string
          enum: [income, expense, transfer, adjustment]
        amount:
          type: integer
          format: int64
          description: |
            Положительный для income/expense/transfer; ненулевое знаковое
            для adjustment.
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        fromAccountId:
          type: string
          format: uuid
          nullable: true
        toAccountId:
          type: string
          format: uuid
          nullable: true
        destinationAmount:
          type: integer
          format: int64
          description: |
            Cross-currency transfer: сумма зачисления в валюте
            `toAccountId` (positive). Отсутствует при одинаковых валютах;
            наличие/отсутствие валидируется против эффективных счетов.

    DebtorSyncData:
      type: object
      additionalProperties: false
      description: Полное состояние должника в sync-операции (upsert).
      required: [name, note, currency]
      properties:
        name:
          type: string
        note:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"

    DebtOperationSyncData:
      type: object
      additionalProperties: false
      description: Полное состояние долговой операции в sync-операции (upsert).
      required: [debtorId, direction, kind, amount, note, occurredAt]
      properties:
        debtorId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [receivable, payable]
        kind:
          type: string
          enum: [debt, repayment]
        amount:
          type: integer
          format: int64
          minimum: 1
        note:
          type: string
        occurredAt:
          type: string
          format: date-time

    PlannedPaymentSyncData:
      type: object
      additionalProperties: false
      description: Полное состояние планового платежа в sync-операции (upsert).
      required:
        [
          type,
          amount,
          name,
          accountId,
          categoryId,
          nextDue,
          anchorDate,
          regularity,
          confirmMode,
          reminder,
          note,
        ]
      properties:
        type:
          type: string
          enum: [expense, income]
        amount:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        nextDue:
          type: string
          format: date
        anchorDate:
          type: string
          format: date
        regularity:
          type: string
          enum: [daily, weekly, monthly, yearly]
        confirmMode:
          type: string
          enum: [manual, auto]
        reminder:
          type: string
          enum: [off, day_before, on_day]
        note:
          type: string

    SyncEntity:
      type: string
      enum: [account, category, transaction, debtor, debt_operation, planned_payment]

    SyncOperation:
      type: object
      description: |
        Одна клиентская операция. `baseVersion` — серверная версия, на которой
        операция основана (0 = запись ещё не существует на сервере). Для
        upsert `data` содержит полное состояние записи; для delete `data`
        отсутствует.
      required: [opId, entity, action, id, baseVersion]
      properties:
        opId:
          type: string
          format: uuid
          description: Клиентский id операции; ключ постоянной идемпотентности.
        entity:
          $ref: "#/components/schemas/SyncEntity"
        action:
          type: string
          enum: [upsert, delete]
        id:
          type: string
          format: uuid
          description: Id записи (клиентский UUID v4 для baseVersion = 0).
        baseVersion:
          type: integer
          format: int
          minimum: 0
        data:
          oneOf:
            - $ref: "#/components/schemas/AccountSyncData"
            - $ref: "#/components/schemas/CategorySyncData"
            - $ref: "#/components/schemas/CategoryDeleteData"
            - $ref: "#/components/schemas/TransactionSyncData"
            - $ref: "#/components/schemas/DebtorSyncData"
            - $ref: "#/components/schemas/DebtOperationSyncData"
            - $ref: "#/components/schemas/PlannedPaymentSyncData"
          description: |
            Полное состояние записи (обязательно для upsert) либо опции
            удаления (для delete категории — `{"cascade": true}`).

    SyncPushRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncOperation"

    SyncServerState:
      type: object
      description: Текущее состояние записи на сервере (в конфликте).
      required: [version, deleted]
      properties:
        version:
          type: integer
          format: int
        deleted:
          type: boolean
          description: true — запись tombstoned на сервере.
        data:
          oneOf:
            - $ref: "#/components/schemas/AccountSyncData"
            - $ref: "#/components/schemas/CategorySyncData"
            - $ref: "#/components/schemas/TransactionSyncData"
            - $ref: "#/components/schemas/DebtorSyncData"
            - $ref: "#/components/schemas/DebtOperationSyncData"
            - $ref: "#/components/schemas/PlannedPaymentSyncData"
          description: Присутствует для не удалённой записи.

    SyncPushResult:
      type: object
      description: Результат одной операции; HTTP ответ — всегда 200.
      required: [opId, status]
      properties:
        opId:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, conflict, error]
        version:
          type: integer
          format: int
          description: Новая серверная версия записи (для status = applied).
        code:
          type: string
          description: |
            Machine-readable код (для conflict/error): `SYNC_VERSION_CONFLICT`,
            `SYNC_ALREADY_EXISTS`, `SYNC_DELETED_CONFLICT` либо коды
            бизнес-правил (`CATEGORY_IN_USE`, `INVALID_REFS`,
            `INVALID_AMOUNT`, ...).
        message:
          type: string
          description: Human-readable сообщение (для conflict/error).
        serverState:
          $ref: "#/components/schemas/SyncServerState"

    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncPushResult"

    SyncChange:
      type: object
      description: Одна запись change-log для pull.
      required: [seq, entity, id, action, version]
      properties:
        seq:
          type: integer
          format: int64
          description: Монотонный порядок изменения.
        entity:
          $ref: "#/components/schemas/SyncEntity"
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [upsert, tombstone]
        version:
          type: integer
          format: int
          description: Серверная версия записи после изменения.
        userId:
          type: string
          format: uuid
          nullable: true
          description: |
            Автор изменения (user id участника, применившего операцию;
            проставляется сервером по сессии). null/отсутствует для записей
            до введения авторства. Push-направление это поле игнорирует:
            сервер всегда штампует отправителя.
        data:
          oneOf:
            - $ref: "#/components/schemas/AccountSyncData"
            - $ref: "#/components/schemas/CategorySyncData"
            - $ref: "#/components/schemas/TransactionSyncData"
            - $ref: "#/components/schemas/DebtorSyncData"
            - $ref: "#/components/schemas/DebtOperationSyncData"
            - $ref: "#/components/schemas/PlannedPaymentSyncData"
          description: Полное состояние записи; присутствует для upsert.

    SyncPullResponse:
      type: object
      required: [changes, nextCursor]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: Курсор следующей страницы; null — клиент догнал сервер.
